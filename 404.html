<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Stats Pilote</title>
  <style>
    :root{
      --bg:#f1f4f8; --card:#fff; --ink:#2c3845; --ink-2:#4a5868; --muted:#6a7886;
      --accent:#6a8caf; --accent-soft:#dde6ef; --line:#d8e2ec; --shadow:0 2px 12px rgba(44,56,69,.08);
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#1f262e;--card:#2a3340;--ink:#e8edf2;--ink-2:#b0bcc8;--muted:#b8c4d0;--accent:#7a9dbf;--accent-soft:#2a3f54;--line:#3a4a5a;--shadow:0 2px 12px rgba(0,0,0,.3);}
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:48px 40px;text-align:center;max-width:480px;width:100%}
    .code{font-size:72px;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-2px;margin-bottom:8px;opacity:.35}
    h1{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px}
    p{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:32px}
    .links{display:flex;flex-direction:column;gap:10px}
    a.btn{display:block;padding:12px 20px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;transition:opacity .15s}
    a.btn-primary{background:var(--accent);color:#fff}
    a.btn:hover{opacity:.85}
    .divider{height:1px;background:var(--line);margin:20px 0}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
    .tool-link{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:44px;border-radius:10px;background:var(--bg);text-decoration:none;font-size:13px;font-weight:500;color:var(--ink-2);border:1px solid var(--line)}
    .tool-link:hover{border-color:var(--accent);color:var(--accent)}
    .tool-icon{font-size:16px;flex-shrink:0}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>L'URL est incorrecte ou la page a été déplacée.<br>Retrouve les outils BMX ci-dessous.</p>
    <div class="links">
      <a class="btn btn-primary" href="https://ludsoc.github.io/sqorz-hub/">&#127968; Retour à l'accueil</a>
    </div>
    <div class="divider"></div>
    <div class="tools">
      <a class="tool-link" href="https://ludsoc.github.io/sqorz-stats/"><span class="tool-icon">&#128100;</span> Stats pilote</a>
      <a class="tool-link" href="https://ludsoc.github.io/sqorz-head2head/"><span class="tool-icon">&#9889;</span> Tête-à-tête</a>
      <a class="tool-link" href="https://ludsoc.github.io/sqorz-club/"><span class="tool-icon">&#128202;</span> Stats club</a>
      <a class="tool-link" href="https://ludsoc.github.io/sqorz-category/"><span class="tool-icon">&#127942;</span> Catégories</a>
      <a class="tool-link" href="https://ludsoc.github.io/sqorz-rankings/"><span class="tool-icon">&#129351;</span> Classements</a>
    </div>
  </div>
</body>
</html>
