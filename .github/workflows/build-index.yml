name: Build pilots index

on:
  schedule:
    - cron: '0 3 * * 1'  # chaque lundi à 3h UTC
  workflow_dispatch:       # déclenchement manuel possible

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Générer les index (Sqorz + UEC/JSTiming + Coupe du monde UCI) et les forces de plateau
        run: |
          node build-index.js
          node build-uec.js
          node build-uciworldcup.js
          # (build-index.js et build-uec.js génèrent aussi field-strength-{fr,uec}.json
          # via build-field.js — indice v2, spec force-plateau)

      - name: Vérifier si les index ont changé (sha256 vs meta commité)
        id: changed
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          let changed = false;
          for (const base of ['pilots-index', 'uci-index', 'uec-index', 'uci-worldcup-index', 'field-strength-fr', 'field-strength-uec']) {
            const m = JSON.parse(fs.readFileSync(base + '.meta.json', 'utf8'));
            try {
              const old = JSON.parse(execSync('git show HEAD:' + base + '.meta.json', { stdio: ['pipe', 'pipe', 'ignore'] }).toString());
              if (old.index.sha256 !== m.index.sha256) changed = true;
            } catch { changed = true; }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + changed + '\n');
          EOF

      # NB : la politique CORS du bucket est configurée une seule fois dans le
      # dashboard Cloudflare (R2 → bucket → Settings → CORS Policy). Le jeton S3
      # « Object Read & Write » n'a pas les droits pour la modifier via l'API.

      # Upload inconditionnel : `aws s3 cp` est idempotent et le bucket peut
      # être vide ou partiel même quand le sha n'a pas changé (premier run,
      # objet supprimé...) — on republie toujours les 12 fichiers.
      - name: Publier les index sur R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.R2_BUCKET_NAME }}"
          declare -A TYPES=(
            [pilots-index.json]=application/json
            [pilots-index.events.ndjson]=application/x-ndjson
            [uci-index.json]=application/json
            [uci-index.events.ndjson]=application/x-ndjson
            [uec-index.json]=application/json
            [uec-index.events.ndjson]=application/x-ndjson
            [uci-worldcup-index.json]=application/json
            [uci-worldcup-index.events.ndjson]=application/x-ndjson
            [field-strength-fr.json]=application/json
            [field-strength-uec.json]=application/json
          )
          for f in "${!TYPES[@]}"; do
            aws s3 cp "$f" "s3://$BUCKET/$f" \
              --endpoint-url "$ENDPOINT" \
              --content-type "${TYPES[$f]}" \
              --cache-control "public, max-age=300"
            echo "Publié : $f"
          done

      - name: Ne plus suivre les gros fichiers (publiés sur R2)
        if: steps.changed.outputs.changed == 'true'
        run: |
          for f in pilots-index.json pilots-index.events.ndjson uci-index.json uci-index.events.ndjson uec-index.json uec-index.events.ndjson uci-worldcup-index.json uci-worldcup-index.events.ndjson; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git rm --cached "$f"; fi
          done

      - name: Commit si changements (metas uniquement)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilots-index.meta.json uci-index.meta.json uec-index.meta.json uci-worldcup-index.meta.json field-strength-fr.meta.json field-strength-uec.meta.json
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à commiter."
          else
            git commit -m "chore: mise à jour des index pilotes (metas ; gros fichiers publiés sur R2)"
            git push
          fi
