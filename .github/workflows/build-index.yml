name: Build pilots index

on:
  schedule:
    - cron: '0 3 * * 1'  # chaque lundi à 3h UTC
  workflow_dispatch:       # déclenchement manuel possible

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vérifier le secret des exclusions RGPD
        # EXCLUDE_HMAC_KEY est requis dès qu'excluded-pilots.json contient des
        # règles "hmac" : sans lui (ou avec le mauvais), build-exclusions.js
        # REFUSE de démarrer plutôt que de republier les résultats d'une personne
        # ayant demandé son effacement. Ce contrôle échoue ici, avant les crawls.
        env:
          EXCLUDE_HMAC_KEY: ${{ secrets.EXCLUDE_HMAC_KEY }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('excluded-pilots.json', 'utf8'));
          const n = (doc.excluded || []).filter(r => r && r.hmac).length;
          const secret = process.env.EXCLUDE_HMAC_KEY || '';
          if (!secret) {
            if (n) {
              console.error(`::error::excluded-pilots.json contient ${n} règle(s) "hmac" mais le secret EXCLUDE_HMAC_KEY n'est pas défini (Repository settings → Secrets). Configure-le, sinon les oppositions RGPD ne pourront pas être appliquées.`);
              process.exit(1);
            }
            console.log('Aucune règle hmac dans la liste d’exclusion — pas de secret requis.');
          } else {
            // Charge réellement le fichier : vérifie le secret ET le vector.
            const { loadExclusions } = require('./build-exclusions.js');
            const ex = loadExclusions();
            console.log(`Secret EXCLUDE_HMAC_KEY vérifié — ${ex.rules} règle(s) d’exclusion, dont ${ex.hmac} hmacée(s), ${ex.clear} en clair.`);
          }
          EOF

      - name: Récupérer clubs.json (canonique, pour hub-search)
        # tools/build-hub-search.cjs cherche clubs.json dans un checkout frère
        # (bmx-race-tools/, monorepo). Sans lui, l'étape de génération échoue
        # après les 3 crawls et R2 n'est jamais mis à jour.
        uses: actions/checkout@v4
        with:
          repository: LudSoc/bmx-race-tools
          path: bmx-race-tools
          sparse-checkout: clubs.json
          sparse-checkout-cone-mode: false

      - name: Générer les index (Sqorz + UEC/JSTiming + Coupe du monde UCI) et les forces de plateau
        env:
          EXCLUDE_HMAC_KEY: ${{ secrets.EXCLUDE_HMAC_KEY }}
        run: |
          node build-index.js
          node build-uec.js
          node build-uciworldcup.js
          # (build-index.js et build-uec.js génèrent aussi field-strength-{fr,uec}.json
          # via build-field.js — indice v2, spec force-plateau)
          # Mini-index de recherche du hub (tous les pilotes + clubs) : doit être
          # regénéré À CHAQUE run, sinon il garde les noms d'pilotes écartés des index
          # (RGPD — liste d'exclusion, cf. build-exclusions.js) et un pilote ayant
          # demandé à être effacé y resterait. Copié vers le site par le sync.
          node tools/build-hub-search.cjs
          node tools/build-perf-rankings.cjs
          # Classement perf (indice 365 j, pool FR+) consommé par l'outil ranking/ :
          # fichier ~770 Ko commité (freshe à chaque run), copié vers le site par
          # le workflow sync de bmx-race-tools (cf. stats/CLAUDE.md « Chaîne de fraîcheur »).

      - name: Vérifier que la LRP applique bien les exclusions RGPD
        # La LRP est le SEUL fichier publié que la liste d'exclusion ne
        # traversait pas : elle est importée à la main et n'est ni générée ni
        # copiée par ce workflow. Sans ce contrôle, une opposition art. 17
        # inscrite dans excluded-pilots.json serait appliquée aux index mais la
        # personne resterait visible dans pilots-lrp-2026.json (300 Ko publié).
        #
        # reduce-lrp.cjs étant idempotent sur un fichier déjà réduit, le relire
        # revient à re-appliquer les exclusions. Si le résultat diffère, c'est
        # que la LRP n'a pas été réinjectée après l'inscription de l'opposition.
        env:
          EXCLUDE_HMAC_KEY: ${{ secrets.EXCLUDE_HMAC_KEY }}
        run: |
          node tools/reduce-lrp.cjs
          if ! git diff --quiet -- pilots-lrp-2026.json; then
            echo "::error::pilots-lrp-2026.json ne reflète pas excluded-pilots.json. Lance 'node tools/reduce-lrp.cjs', puis copie le résultat dans bmx-race-tools/stats/pilots-lrp-2026.json avant de relancer ce workflow."
            git --no-pager diff --stat -- pilots-lrp-2026.json
            exit 1
          fi
          echo "LRP conforme à la liste d'exclusion."

      - name: Vérifier si les index ont changé (sha256 vs meta commité)
        id: changed
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          let changed = false;
          for (const base of ['pilots-index', 'uci-index', 'uec-index', 'uci-worldcup-index', 'field-strength-fr', 'field-strength-uec']) {
            const m = JSON.parse(fs.readFileSync(base + '.meta.json', 'utf8'));
            try {
              const old = JSON.parse(execSync('git show HEAD:' + base + '.meta.json', { stdio: ['pipe', 'pipe', 'ignore'] }).toString());
              if (old.index.sha256 !== m.index.sha256) changed = true;
            } catch { changed = true; }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + changed + '\n');
          EOF

      # NB : la politique CORS du bucket est configurée une seule fois dans le
      # dashboard Cloudflare (R2 → bucket → Settings → CORS Policy). Le jeton S3
      # « Object Read & Write » n'a pas les droits pour la modifier via l'API.

      # Upload inconditionnel : `aws s3 cp` est idempotent et le bucket peut
      # être vide ou partiel même quand le sha n'a pas changé (premier run,
      # objet supprimé...) — on republie toujours les 12 fichiers.
      - name: Publier les index sur R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="${{ secrets.R2_BUCKET_NAME }}"
          declare -A TYPES=(
            [pilots-index.json]=application/json
            [pilots-index.events.ndjson]=application/x-ndjson
            [uci-index.json]=application/json
            [uci-index.events.ndjson]=application/x-ndjson
            [uec-index.json]=application/json
            [uec-index.events.ndjson]=application/x-ndjson
            [uci-worldcup-index.json]=application/json
            [uci-worldcup-index.events.ndjson]=application/x-ndjson
            [field-strength-fr.json]=application/json
            [field-strength-uec.json]=application/json
          )
          for f in "${!TYPES[@]}"; do
            aws s3 cp "$f" "s3://$BUCKET/$f" \
              --endpoint-url "$ENDPOINT" \
              --content-type "${TYPES[$f]}" \
              --cache-control "public, max-age=300"
            echo "Publié : $f"
          done

      - name: Ne plus suivre les gros fichiers (publiés sur R2)
        if: steps.changed.outputs.changed == 'true'
        run: |
          for f in pilots-index.json pilots-index.events.ndjson uci-index.json uci-index.events.ndjson uec-index.json uec-index.events.ndjson uci-worldcup-index.json uci-worldcup-index.events.ndjson; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git rm --cached "$f"; fi
          done

      - name: Commit si changements (metas uniquement)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilots-index.meta.json uci-index.meta.json uec-index.meta.json uci-worldcup-index.meta.json field-strength-fr.meta.json field-strength-uec.meta.json perf-rankings.json hub-search.json
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à commiter."
          else
            git commit -m "chore: mise à jour des index pilotes (metas ; gros fichiers publiés sur R2)"
            git push
          fi
